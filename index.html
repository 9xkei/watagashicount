<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>綿菓子カウンター</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --md-sys-color-primary: #0b57d0;
            --md-sys-color-on-primary: #ffffff;
            --md-sys-color-surface: #ffffff;
            --md-sys-color-on-surface: #1f1f1f;
            --md-sys-color-surface-variant: #e1e3e1;
            --md-sys-color-on-surface-variant: #444746;
            --md-sys-color-background: #f3f4f6;
            --md-sys-color-outline: #747775;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Roboto', 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--md-sys-color-background);
            color: var(--md-sys-color-on-surface);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            user-select: none;
        }

        .container {
            background-color: var(--md-sys-color-surface);
            border-radius: 24px;
            padding: 32px;
            width: 100%;
            max-width: 320px;
            box-shadow: 0 1px 3px 0 rgba(0,0,0,0.1), 0 1px 2px -1px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .title {
            font-size: 22px;
            font-weight: 400;
            margin: 0 0 32px 0;
            color: var(--md-sys-color-on-surface);
        }

        .counter-layout {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            margin-bottom: 32px;
            width: 100%;
        }

        .icon-btn {
            background-color: transparent;
            border: none;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background-color 0.2s ease;
            color: var(--md-sys-color-on-surface-variant);
        }

        .icon-btn:hover {
            background-color: rgba(68, 71, 70, 0.08);
        }

        .icon-btn:active {
            background-color: rgba(68, 71, 70, 0.12);
        }

        .icon-btn svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }

        .input-wrapper {
            position: relative;
            display: inline-block;
        }

        .count-input {
            width: 80px;
            font-size: 32px;
            font-weight: 400;
            text-align: center;
            color: var(--md-sys-color-on-surface);
            background: transparent;
            border: none;
            border-bottom: 2px solid var(--md-sys-color-outline);
            padding: 4px 0;
            outline: none;
            transition: border-color 0.2s ease;
            font-family: inherit;
        }

        .count-input:focus {
            border-bottom-color: var(--md-sys-color-primary);
        }

        .count-input::-webkit-outer-spin-button,
        .count-input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .text-btn {
            background: transparent;
            border: none;
            color: var(--md-sys-color-primary);
            font-size: 14px;
            font-weight: 500;
            padding: 10px 16px;
            border-radius: 20px;
            cursor: pointer;
            transition: background-color 0.2s ease;
            font-family: inherit;
        }

        .text-btn:hover {
            background-color: rgba(11, 87, 208, 0.08);
        }

        .text-btn:active {
            background-color: rgba(11, 87, 208, 0.12);
        }

        /* マテリアルデザインのスナックバー（通知） */
        .snackbar {
            visibility: hidden;
            min-width: 288px;
            background-color: #313033;
            color: #f4eff4;
            text-align: left;
            border-radius: 4px;
            padding: 14px 16px;
            position: fixed;
            z-index: 1;
            left: 50%;
            bottom: 24px;
            transform: translateX(-50%);
            font-size: 14px;
            font-weight: 400;
            box-shadow: 0 3px 5px -1px rgba(0,0,0,.2), 0 6px 10px 0 rgba(0,0,0,.14), 0 1px 18px 0 rgba(0,0,0,.12);
            opacity: 0;
            transition: opacity 0.3s, bottom 0.3s;
        }

        .snackbar.show {
            visibility: visible;
            opacity: 1;
            bottom: 32px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 class="title">綿菓子カウンター</h1>
        
        <div class="counter-layout">
            <button class="icon-btn" onclick="updateCount(-1)" aria-label="減らす">
                <svg viewBox="0 0 24 24"><path d="M19 13H5v-2h14v2z"/></svg>
            </button>
            
            <div class="input-wrapper">
                <input type="number" id="countInput" class="count-input" value="0" min="0" onchange="handleDirectInput()">
            </div>
            
            <button class="icon-btn" onclick="updateCount(1)" aria-label="増やす">
                <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
            </button>
        </div>

        <button class="text-btn" onclick="resetCount()">リセット</button>
    </div>

    <div id="snackbar" class="snackbar">保存しました</div>

    <script>
        const STORAGE_KEY = 'cotton_candy_count';
        let snackbarTimeout;

        // クッキー処理
        function setCookie(name, value, days = 365) {
            const date = new Date();
            date.setTime(date.getTime() + (days * 24 * 60 * 60 * 1000));
            document.cookie = `${name}=${value}; expires=${date.toUTCString()}; path=/; SameSite=Lax`;
        }

        function getCookie(name) {
            const match = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
            return match ? match[2] : null;
        }

        function showSnackbar(message) {
            const snackbar = document.getElementById('snackbar');
            snackbar.textContent = message;
            snackbar.classList.add('show');
            
            clearTimeout(snackbarTimeout);
            snackbarTimeout = setTimeout(() => {
                snackbar.classList.remove('show');
            }, 3000);
        }

        function saveAndNotify(value, isReset = false) {
            setCookie(STORAGE_KEY, value);
            showSnackbar(isReset ? 'リセットしました' : '保存しました');
        }

        function getInputValue() {
            const input = document.getElementById('countInput');
            const val = parseInt(input.value, 10);
            return isNaN(val) || val < 0 ? 0 : val;
        }

        function updateCount(amount) {
            const input = document.getElementById('countInput');
            let current = getInputValue();
            current = Math.max(0, current + amount);
            input.value = current;
            saveAndNotify(current);
        }

        function handleDirectInput() {
            const input = document.getElementById('countInput');
            const current = getInputValue();
            input.value = current;
            saveAndNotify(current);
        }

        function resetCount() {
            if (getInputValue() === 0) return;
            const input = document.getElementById('countInput');
            input.value = 0;
            saveAndNotify(0, true);
        }

        // 初期化
        document.addEventListener('DOMContentLoaded', () => {
            const saved = getCookie(STORAGE_KEY);
            if (saved !== null) {
                document.getElementById('countInput').value = Math.max(0, parseInt(saved, 10) || 0);
            }
        });
    </script>
</body>
</html>
