<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>綿菓子カウンター</title>
    <!-- Google Fonts (Googleのプロダクトでよく使われるフォント) -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', Arial, sans-serif;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #202124;
        }
        .card {
            background: #ffffff;
            padding: 40px 32px;
            border-radius: 8px;
            box-shadow: 0 1px 3px 0 rgba(60,64,67,0.3), 0 4px 8px 3px rgba(60,64,67,0.15);
            text-align: center;
            max-width: 360px;
            width: 100%;
        }
        /* Googleの4色を使ったロゴ風タイトル */
        .google-logo {
            font-size: 1.8rem;
            font-weight: 500;
            margin-bottom: 24px;
            letter-spacing: -0.5px;
        }
        .g-blue { color: #4285F4; }
        .g-red { color: #EA4335; }
        .g-yellow { color: #FBBC05; }
        .g-green { color: #34A853; }

        .icon {
            font-size: 3rem;
            margin-bottom: 12px;
        }
        .counter-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
            margin-bottom: 24px;
        }
        button.btn-count {
            background-color: #ffffff;
            color: #5f6368;
            border: 1px solid #dadce0;
            width: 56px;
            height: 56px;
            font-size: 1.8rem;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s, box-shadow 0.2s, border-color 0.2s;
            outline: none;
            box-shadow: 0 1px 2px 0 rgba(60,64,67,0.3);
        }
        button.btn-count:hover {
            background-color: #f8f9fa;
            border-color: #dadce0;
            box-shadow: 0 1px 3px 1px rgba(60,64,67,0.15);
            color: #202124;
        }
        button.btn-count:active {
            background-color: #f1f3f4;
        }
        input[type="number"] {
            width: 90px;
            height: 56px;
            font-size: 1.8rem;
            font-family: 'Roboto', Arial, sans-serif;
            text-align: center;
            border: 1px solid #dadce0;
            border-radius: 8px;
            outline: none;
            color: #202124;
            transition: border-color 0.2s, box-shadow 0.2s;
            background-color: #fff;
        }
        input[type="number"]:focus {
            border-color: #4285F4;
            box-shadow: 0 0 0 2px rgba(66,133,244,0.2);
        }
        /* スピンボタンを非表示 */
        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        .reset-btn {
            background-color: transparent;
            border: none;
            color: #5f6368;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            transition: background-color 0.2s, color 0.2s;
        }
        .reset-btn:hover {
            background-color: #f1f3f4;
            color: #202124;
        }
        .save-status {
            font-size: 0.8rem;
            color: #70757a;
            margin-top: 16px;
            height: 1.2em;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="icon">🍬</div>
        <div class="google-logo">
            <span class="g-blue">綿</span><span class="g-red">菓</span><span class="g-yellow">子</span><span class="g-green">計数機</span>
        </div>
        
        <div class="counter-container">
            <button class="btn-count" onclick="updateCount(-1)">−</button>
            <input type="number" id="countInput" value="0" min="0" oninput="handleDirectInput()">
            <button class="btn-count" onclick="updateCount(1)">＋</button>
        </div>

        <button class="reset-btn" onclick="resetCount()">すべてリセット</button>
        
        <div id="saveStatus" class="save-status"></div>
    </div>

    <script>
        const COOKIE_NAME = 'cotton_candy_count';
        const COOKIE_DAYS = 365;

        function setCookie(name, value, days) {
            let expires = "";
            if (days) {
                const date = new Date();
                date.setTime(date.getTime() + (days * 24 * 60 * 60 * 1000));
                expires = "; expires=" + date.toUTCString();
            }
            document.cookie = name + "=" + (value || "") + expires + "; path=/; SameSite=Lax";
            showSaveStatus();
        }

        function getCookie(name) {
            const nameEQ = name + "=";
            const ca = document.cookie.split(';');
            for(let i = 0; i < ca.length; i++) {
                let c = ca[i];
                while (c.charAt(0) == ' ') c = c.substring(1, c.length);
                if (c.indexOf(nameEQ) == 0) return c.substring(nameEQ.length, c.length);
            }
            return null;
        }

        function showSaveStatus() {
            const status = document.getElementById('saveStatus');
            status.textContent = "変更を保存しました";
            setTimeout(() => {
                status.textContent = "";
            }, 1500);
        }

        window.onload = function() {
            const savedCount = getCookie(COOKIE_NAME);
            if (savedCount !== null) {
                document.getElementById('countInput').value = Math.max(0, parseInt(savedCount, 10) || 0);
            }
        };

        function updateCount(amount) {
            const input = document.getElementById('countInput');
            let current = parseInt(input.value, 10) || 0;
            current += amount;
            if (current < 0) current = 0;
            
            input.value = current;
            setCookie(COOKIE_NAME, current, COOKIE_DAYS);
        }

        function handleDirectInput() {
            const input = document.getElementById('countInput');
            let current = parseInt(input.value, 10);
            
            if (isNaN(current) || current < 0) {
                current = 0;
            }
            
            setCookie(COOKIE_NAME, current, COOKIE_DAYS);
        }

        function resetCount() {
            if (confirm('個数を0にリセットしますか？')) {
                const input = document.getElementById('countInput');
                input.value = 0;
                setCookie(COOKIE_NAME, 0, COOKIE_DAYS);
            }
        }
    </script>

</body>
</html>
